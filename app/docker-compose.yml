services:
  web:
    build: .
    ports:
      - "5173:5173"
    volumes:
      # Mount the project so edits and the /admin page write straight to your files.
      - .:/app
      # Keep the container's node_modules separate from your machine's.
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true   # reliable hot reload on Docker Desktop (Mac/Windows)
    restart: unless-stopped
